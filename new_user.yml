---
- name: Создание нового пользовтеля в операционной сиситеме Linux
  hosts: localhost
  vars:
    newuser: petrov_1.dv
    user_password: "pa$$w0rd21"
    group: sudo
    curl: curl
  tasks:
    - name: Создание нового пользовтеля в операционной сиситеме Linux
      user:      
        name: "{{newuser}}"
        password: "{{user_password}}"  
        groups: "{{group}}"
        append: yes 
        create_home: true
    - name: Добавить алиас в .bashrc
      lineinfile:
        path: /home/{{ newuser }}/.bashrc
        regexp: "^alias la="
        line: "alias la='ls -la --color=auto'"
        insertafter: EOF
        state: present
        create: yes
        backup: yes
      become: false    
    - name: Получить информацию о пользователе
      user:
        name: "{{ newuser }}"
      register: user_info
      ignore_errors: yes
    - name: Отладка - показать информацию о пользователе
      debug:
        msg: "User info: {{ user_info }}"
    - name: Source .bashrc for current session (optional)
      shell: source ~/.bashrc
      args:
        executable: /bin/bash
---
- name: Настройка сервера
  hosts: localhost
  vars:
    tmux: tmux
    mc: mc
    curl: curl
  tasks:
    - name: Установка tmux
      apt:
        name: "{{tmux}}"
        state: present
        update_cache: true
    - name: Установка MC    
      apt:
        name: "{{mc}}"
        state: present 
    - name: Установка curl   
      apt:
        name: "{{curl}}"
        state: present